[project]
name = "labs"
version = "0.1.0"
description = "To learn NLP course with labs"
readme = "README.md"
authors = [
    { name = "adarshtripathi", email = "ad.tripathi@students.hertie-school.org" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "nltk==3.10.3",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "plotly==6.9.0",
    "scikit-learn==1.9.0",
    "sentence-transformers==6.0.1",
    "spacy==3.8.14",
    "tokenizers==0.23.1",
]

[project.scripts]
labs = "labs:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
